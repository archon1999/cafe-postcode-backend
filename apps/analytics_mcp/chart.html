<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savdo hisoboti · Cafe Postcode</title><style>
:root{color-scheme:light dark;--blue:#3385f0;--ink:light-dark(#1b2124,#ebf2f5);--muted:light-dark(#4d595e,#9caeb8);--line:light-dark(#dbe6eb,#303c44);--surface:light-dark(#fff,#111417);--soft:light-dark(#f7fafc,#1b2124)}*{box-sizing:border-box}body{margin:0;font:13px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:transparent}main{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 22px 16px}h1{font-size:17px;letter-spacing:-.3px;line-height:1.4;margin:0;font-weight:650}.sub{margin:5px 0 0;color:var(--muted);font-size:12px}.scope{margin:0 22px 16px;color:var(--muted);font-size:12px}select{max-width:150px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}select:focus-visible,summary:focus-visible,circle:focus-visible{outline:2px solid var(--blue);outline-offset:3px}.stats{display:grid;grid-template-columns:1.6fr 1fr 1fr;border-block:1px solid var(--line);background:var(--soft)}.stat{padding:15px 22px;min-width:0}.stat+.stat{border-left:1px solid var(--line)}.label{display:block;color:var(--muted);font-size:11px;margin-bottom:5px}.value{font-variant-numeric:tabular-nums;font-size:20px;line-height:1.3;font-weight:650;letter-spacing:-.5px;overflow-wrap:anywhere}.primary .value{font-size:26px}.unit{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px;letter-spacing:0}.plot{padding:18px 16px 0}svg{display:block;width:100%;height:210px;overflow:visible}.axis{font-size:10px;fill:var(--muted)}.grid{stroke:var(--line);stroke-dasharray:3 5}.tooltip{min-height:20px;margin:0 7px 8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.legend{display:flex;align-items:center;gap:6px;padding:0 22px;font-size:11px;color:var(--muted)}.dot{width:7px;height:7px;background:var(--blue);border-radius:50%}details{margin-top:16px;border-top:1px solid var(--line)}summary{padding:12px 22px;cursor:pointer;font-size:12px;font-weight:550;list-style:none;display:flex;justify-content:space-between;gap:10px}summary:after{content:'+';font-size:16px;color:var(--muted)}details[open] summary:after{content:'−'}.tablewrap{max-height:280px;overflow:auto;padding:0 14px 8px}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:11px;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--muted);background:var(--surface);position:sticky;top:0}th:first-child,td:first-child{text-align:left}footer{border-top:1px solid var(--line);padding:10px 22px;color:var(--muted);font-size:10px;display:flex;gap:12px;justify-content:space-between}[hidden]{display:none!important}@media(max-width:430px){header{padding:16px;gap:8px}h1{font-size:15px}select{font-size:11px;max-width:125px}.stat{padding:12px}.value{font-size:16px}.primary .value{font-size:20px}.stats{grid-template-columns:1.35fr 1fr 1fr}.scope{margin:0 16px 12px}.unit{display:block;margin:3px 0 0}footer{display:block;padding:10px 16px}footer span{display:block}svg{height:185px}}
</style></head><body><main id="report" aria-busy="true"><header><div><h1>Savdo hisoboti</h1><p class="sub" id="period">Hisobot yuklanmoqda…</p></div><select id="metric" aria-label="Ko‘rsatkich"><option value="sales_total">Sof tushum</option><option value="gross_sales_total">Jami tushum</option><option value="refunds_total">Qaytarishlar</option><option value="orders_count">Buyurtmalar</option></select></header><p class="scope" id="branches" hidden></p>
<section class="stats" aria-label="Davr ko‘rsatkichlari"><div class="stat primary"><span class="label" id="metric-label">Sof tushum</span><span class="value" id="total">—</span><span class="unit" id="currency"></span></div><div class="stat"><span class="label">Buyurtmalar</span><span class="value" id="orders">—</span><span class="unit">ta</span></div><div class="stat"><span class="label">Qaytarishlar</span><span class="value" id="refunds">—</span><span class="unit" id="refund-unit"></span></div></section>
<div class="plot"><svg id="chart" viewBox="0 0 640 208" role="img" aria-label="Savdo grafigi"></svg><p class="tooltip" id="point-detail" aria-live="polite">Nuqta ustida kunlik qiymatni ko‘ring</p></div><div class="legend"><span class="dot"></span><span id="basis">To‘lovlar minus qaytarishlar</span></div><details><summary>Kunlik ma’lumotlar <span id="row-count"></span></summary><div class="tablewrap"><table><thead><tr><th>Sana</th><th>Jami tushum</th><th>Qaytarish</th><th>Sof tushum</th><th>Buyurtma</th></tr></thead><tbody id="rows"></tbody></table></div></details><footer><span id="cutoff"></span><span>Sinxronlanmagan offline savdolar kiritilmagan</span></footer></main>
<script>
(()=>{'use strict';let report=null;const byId=id=>document.getElementById(id),num=new Intl.NumberFormat('ru-RU'),ns='http://www.w3.org/2000/svg',text=(id,value)=>{byId(id).textContent=value};
const dateLabel=value=>new Intl.DateTimeFormat('uz-UZ',{day:'numeric',month:'short',timeZone:'Asia/Tashkent'}).format(new Date(value.length===10?value+'T12:00:00+05:00':value));
function svg(tag,attrs,value){const el=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,String(v));if(value!==undefined)el.textContent=value;byId('chart').appendChild(el);return el}
function axis(n){const a=Math.abs(n);return a>=1e9?num.format(+(n/1e9).toFixed(1))+' mlrd':a>=1e6?num.format(+(n/1e6).toFixed(1))+' mln':a>=1e3?num.format(+(n/1e3).toFixed(1))+' ming':num.format(Math.round(n))}
function render(data){if(data)report=data;if(!report||!Array.isArray(report.data?.points)||!report.period)return;const points=report.data.points;if(points.length>2200||points.some(p=>!p||typeof p.date!=='string'))return;const metric=byId('metric').value,vals=points.map(p=>Number(p[metric]));if(vals.some(v=>!Number.isFinite(v)))return;const totals=report.data.totals||{},currency=report.currency==='UZS'?'so‘m':report.currency||'';
text('period',dateLabel(report.period.start_date)+' — '+dateLabel(report.period.end_date)+' '+report.period.end_date.slice(0,4));const multiple=report.branches?.length>1;byId('branches').hidden=!multiple;if(multiple)text('branches',report.branches.map(b=>b.name).join(' · '));text('metric-label',byId('metric').selectedOptions[0].textContent);text('total',num.format(vals.reduce((a,b)=>a+b,0)));text('currency',metric==='orders_count'?'ta':currency);text('orders',num.format(totals.orders_count||0));text('refunds',num.format(totals.refunds_total||0));text('refund-unit',currency);text('basis',metric==='sales_total'?'Sof tushum · to‘lovlar minus qaytarishlar, foyda emas':byId('metric').selectedOptions[0].textContent);const cutoff=new Intl.DateTimeFormat('uz-UZ',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Tashkent'}).format(new Date(report.generated_at));text('cutoff',(report.period.is_partial?'Bugun '+cutoff+' gacha':'Yangilangan: '+cutoff)+' · Toshkent');byId('chart').replaceChildren();byId('rows').replaceChildren();byId('report').setAttribute('aria-busy','false');text('row-count',points.length+(report.data.granularity==='hour'?' soat':' kun'));if(!points.length){text('point-detail','Bu davrda savdo qayd etilmagan.');resize();return}
const lo=Math.min(0,...vals),max=Math.max(1,...vals),step=Math.pow(10,Math.floor(Math.log10(max-lo)))/2,hi=Math.ceil(max/step)*step,x=i=>58+(points.length===1?278:i*556/(points.length-1)),y=v=>168-(v-lo)/(hi-lo)*145;
for(let i=0;i<4;i++){const v=lo+(hi-lo)*i/3;svg('line',{x1:58,x2:614,y1:y(v),y2:y(v),class:'grid'});svg('text',{x:47,y:y(v)+3,'text-anchor':'end',class:'axis'},axis(v))}svg('polyline',{points:vals.map((v,i)=>x(i)+','+y(v)).join(' '),fill:'none',stroke:'#3385f0','stroke-width':2.5,'stroke-linejoin':'round','stroke-linecap':'round'});
vals.forEach((v,i)=>{const dot=svg('circle',{cx:x(i),cy:y(v),r:points.length>40?2:3.5,fill:'#3385f0',tabindex:0,role:'img','aria-label':points[i].date+': '+num.format(v)}),show=()=>text('point-detail',points[i].date+' · '+num.format(v)+' '+(metric==='orders_count'?'ta':currency));dot.addEventListener('mouseenter',show);dot.addEventListener('focus',show);const tip=document.createElementNS(ns,'title');tip.textContent=points[i].date+': '+num.format(v);dot.appendChild(tip)});
for(const i of new Set([0,Math.floor((points.length-1)/2),points.length-1]))svg('text',{x:x(i),y:194,'text-anchor':i===0?'start':i===points.length-1?'end':'middle',class:'axis'},points[i].date.length>10?points[i].date.slice(11,16):dateLabel(points[i].date));for(const p of points){const tr=document.createElement('tr');for(const v of [p.date,...['gross_sales_total','refunds_total','sales_total','orders_count'].map(k=>num.format(p[k]))]){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}byId('rows').appendChild(tr)}resize()}
function send(message){window.parent.postMessage({jsonrpc:'2.0',...message},'*')}function resize(){send({method:'ui/notifications/size-changed',params:{height:document.documentElement.scrollHeight}})}window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id===1&&m.result){send({method:'ui/notifications/initialized',params:{}});resize()}if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent)});byId('metric').addEventListener('change',()=>render());document.querySelector('details').addEventListener('toggle',resize);send({id:1,method:'ui/initialize',params:{protocolVersion:'2026-01-26',appInfo:{name:'Cafe Postcode Sales',version:'1.1.0'},appCapabilities:{}}});if(window.openai?.toolOutput)render(window.openai.toolOutput);window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.toolOutput)render(event.detail.globals.toolOutput)});
})();
</script></body></html>
