<!doctype html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savdo · Cafe Postcode</title><style>
:root{color-scheme:light dark;--ink:light-dark(#202020,#ececec);--muted:light-dark(#777,#a3a3a3);--line:light-dark(#ededed,#333);--surface:light-dark(#fff,#212121);--soft:light-dark(#f7f7f7,#292929);--accent:light-dark(#303030,#e8e8e8);--font:var(--font-sans,ui-sans-serif,-apple-system,system-ui,"Segoe UI",Helvetica,Arial,sans-serif)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 var(--font);color:var(--ink);background:transparent;-webkit-font-smoothing:antialiased}main{padding:20px 22px 12px;background:var(--surface);overflow:hidden}header{display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:14px;line-height:1.5;margin:0;font-weight:500}.sub{margin:2px 0 0;color:var(--muted);font-size:12px}.scope{margin:8px 0 0;color:var(--muted);font-size:12px}select{font:400 12px var(--font);color:var(--ink);background:var(--soft);border:0;border-radius:6px;padding:7px 9px;cursor:pointer;max-width:148px}select:focus-visible,summary:focus-visible,circle:focus-visible{outline:2px solid var(--ink);outline-offset:3px}.headline{display:flex;align-items:baseline;gap:7px;margin-top:18px;font-variant-numeric:tabular-nums}.value{font-size:30px;line-height:1.2;font-weight:500;letter-spacing:-1px}.unit{font-size:14px;color:var(--muted)}.context{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.context strong{color:inherit;font-weight:400}.plot{position:relative;margin:16px 0 0}svg{display:block;width:100%;height:180px;overflow:visible}.axis{font:11px var(--font);fill:var(--muted)}.grid{stroke:var(--line);stroke-width:1}.tooltip{height:20px;margin:0;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}details{margin-top:3px}summary{padding:5px 0;cursor:pointer;font-size:12px;font-weight:400;list-style:none;display:flex;align-items:center;gap:7px;color:var(--muted);width:fit-content}summary:after{content:'⌄';font-size:13px}details[open] summary:after{content:'⌃'}summary:hover{color:var(--ink)}#row-count{display:none}.tablewrap{max-height:260px;overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%;white-space:nowrap;font-size:12px;font-variant-numeric:tabular-nums}th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line)}th{font-weight:500;color:var(--muted);background:var(--surface);position:sticky;top:0}th:first-child,td:first-child{text-align:left;padding-left:0}[hidden]{display:none!important}@media(max-width:430px){main{padding:16px 16px 10px}.value{font-size:28px}header{gap:8px}select{max-width:125px}.headline{margin-top:16px}.context{gap:4px 12px}}
</style></head><body>
<main id="report" aria-busy="true">
  <header><div><h1>Savdo</h1><p class="sub" id="period">Hisobot yuklanmoqda…</p></div><select id="metric" aria-label="Ko‘rsatkich"><option value="sales_total">Sof tushum</option><option value="gross_sales_total">Jami tushum</option><option value="refunds_total">Qaytarishlar</option><option value="orders_count">Buyurtmalar</option></select></header>
  <p class="scope" id="branches" hidden></p>
  <div class="headline"><span class="value" id="total">—</span><span class="unit" id="currency"></span></div>
  <div class="context"><span><strong id="orders">—</strong> ta buyurtma</span><span id="refund-context"><strong id="refunds">—</strong> <span id="refund-unit"></span> qaytarilgan</span></div>
  <span id="metric-label" hidden></span>
  <div class="plot"><svg id="chart" role="img" aria-label="Kunlik savdo grafigi"></svg><p class="tooltip" id="point-detail" aria-live="polite"></p></div>
  <details><summary>Jadval <span id="row-count"></span></summary><div class="tablewrap"><table><thead><tr><th>Sana</th><th>Jami tushum</th><th>Qaytarish</th><th>Sof tushum</th><th>Buyurtma</th></tr></thead><tbody id="rows"></tbody></table></div></details>
</main>
<script>
(()=>{'use strict';let report=null;const byId=id=>document.getElementById(id),num=new Intl.NumberFormat('ru-RU'),ns='http://www.w3.org/2000/svg',text=(id,value)=>{byId(id).textContent=value};
const months=['yan','fev','mar','apr','may','iyn','iyl','avg','sen','okt','noy','dek'];const dateLabel=value=>Number(value.slice(8,10))+'-'+months[Number(value.slice(5,7))-1];
function svg(tag,attrs,value){const el=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))el.setAttribute(k,String(v));if(value!==undefined)el.textContent=value;byId('chart').appendChild(el);return el}
function axis(n){const a=Math.abs(n);return a>=1e9?num.format(+(n/1e9).toFixed(1))+' mlrd':a>=1e6?num.format(+(n/1e6).toFixed(1))+' mln':a>=1e3?num.format(+(n/1e3).toFixed(1))+' ming':num.format(Math.round(n))}
function render(data){if(data)report=data;if(!report||!Array.isArray(report.data?.points)||!report.period)return;const points=report.data.points;if(points.length>2200||points.some(p=>!p||typeof p.date!=='string'))return;const metric=byId('metric').value,vals=points.map(p=>Number(p[metric]));if(vals.some(v=>!Number.isFinite(v)))return;const totals=report.data.totals||{},currency=report.currency==='UZS'?'so‘m':report.currency||'';
text('period',dateLabel(report.period.start_date)+' — '+dateLabel(report.period.end_date)+' '+report.period.end_date.slice(0,4));const multiple=report.branches?.length>1;byId('branches').hidden=!multiple;if(multiple)text('branches',report.branches.map(b=>b.name).join(' · '));text('metric-label',byId('metric').selectedOptions[0].textContent);text('total',num.format(vals.reduce((a,b)=>a+b,0)));text('currency',metric==='orders_count'?'ta':currency);text('orders',num.format(totals.orders_count||0));text('refunds',num.format(totals.refunds_total||0));text('refund-unit',currency);byId('refund-context').hidden=!(totals.refunds_total>0);byId('chart').replaceChildren();byId('rows').replaceChildren();byId('report').setAttribute('aria-busy','false');text('point-detail','');text('row-count',points.length+(report.data.granularity==='hour'?' soat':' kun'));if(!points.length){text('point-detail','Bu davrda savdo qayd etilmagan.');resize();return}
const width=Math.max(280,byId('chart').clientWidth);byId('chart').setAttribute('viewBox','0 0 '+width+' 180');const min=Math.min(0,...vals),max=Math.max(1,...vals),rawStep=(max-min)/3,power=10**Math.floor(Math.log10(rawStep)),ratio=rawStep/power,step=(ratio<=1?1:ratio<=2?2:ratio<=5?5:10)*power,unit=metric==='orders_count'?Math.max(1,step):step,lo=Math.floor(min/unit)*unit,hi=Math.ceil(max/unit)*unit,x=i=>48+(points.length===1?(width-60)/2:i*(width-60)/(points.length-1)),y=v=>148-(v-lo)/(hi-lo)*126;
for(let v=lo;v<=hi+unit/10;v+=unit){svg('line',{x1:48,x2:width-12,y1:y(v),y2:y(v),class:'grid'});svg('text',{x:38,y:y(v)+3,'text-anchor':'end',class:'axis'},axis(v))}svg('polyline',{points:vals.map((v,i)=>x(i)+','+y(v)).join(' '),fill:'none',stroke:'var(--accent)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'});
vals.forEach((v,i)=>{const dot=svg('circle',{cx:x(i),cy:y(v),r:8,fill:'transparent',tabindex:0,role:'img','aria-label':points[i].date+': '+num.format(v)}),show=()=>text('point-detail',points[i].date+' · '+num.format(v)+' '+(metric==='orders_count'?'ta':currency));dot.addEventListener('mouseenter',show);dot.addEventListener('focus',show);dot.addEventListener('click',show);dot.addEventListener('mouseleave',()=>text('point-detail',''));dot.addEventListener('blur',()=>text('point-detail',''));const tip=document.createElementNS(ns,'title');tip.textContent=points[i].date+': '+num.format(v);dot.appendChild(tip)});
for(const i of (points.length<=7&&width>450?points.map((_,i)=>i):new Set([0,Math.floor((points.length-1)/2),points.length-1])))svg('text',{x:x(i),y:174,'text-anchor':i===0?'start':i===points.length-1?'end':'middle',class:'axis'},points[i].date.length>10?points[i].date.slice(11,16):dateLabel(points[i].date));for(const p of points){const tr=document.createElement('tr');for(const v of [p.date,...['gross_sales_total','refunds_total','sales_total','orders_count'].map(k=>num.format(p[k]))]){const td=document.createElement('td');td.textContent=v;tr.appendChild(td)}byId('rows').appendChild(tr)}resize()}
function send(message){window.parent.postMessage({jsonrpc:'2.0',...message},'*')}function resize(){send({method:'ui/notifications/size-changed',params:{height:document.documentElement.scrollHeight}})}window.addEventListener('message',event=>{if(event.source!==window.parent)return;const m=event.data;if(!m||m.jsonrpc!=='2.0')return;if(m.id===1&&m.result){send({method:'ui/notifications/initialized',params:{}});resize()}if(m.method==='ui/notifications/tool-result')render(m.params?.structuredContent)});byId('metric').addEventListener('change',()=>render());window.addEventListener('resize',()=>render());document.querySelector('details').addEventListener('toggle',resize);send({id:1,method:'ui/initialize',params:{protocolVersion:'2026-01-26',appInfo:{name:'Cafe Postcode Sales',version:'1.3.0'},appCapabilities:{}}});if(window.openai?.toolOutput)render(window.openai.toolOutput);window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.toolOutput)render(event.detail.globals.toolOutput)});
})();
</script></body></html>
