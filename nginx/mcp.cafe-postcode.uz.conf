# Included at http context AFTER cafe-postcode.uz.conf (shared Cloudflare peer map).
log_format mcp_safe '$remote_addr $request_method $uri $status $request_time';
limit_req_zone $binary_remote_addr zone=mcp_edge:10m rate=10r/s;
server {
    listen 80;
    listen [::]:80;
    server_name mcp.cafe-postcode.uz;
    if ($postcode_origin_allowed = 0) { return 444; }
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.cafe-postcode.uz;
    if ($postcode_origin_allowed = 0) { return 444; }
    ssl_certificate /etc/letsencrypt/live/mcp.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/mcp-access.log mcp_safe;
    error_log /var/log/nginx/mcp-error.log warn;
    client_max_body_size 64k;
    client_body_timeout 10s;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    location = /readyz/ { return 404; }
    location / {
        limit_req zone=mcp_edge burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:18765;
        proxy_set_header Host mcp.cafe-postcode.uz;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 3s;
    }
}
