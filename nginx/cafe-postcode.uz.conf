    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    server_name dashboard.cafe-postcode.uz;

    root /home/postcode/dashboard-frontend/dist;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/dashboard.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
