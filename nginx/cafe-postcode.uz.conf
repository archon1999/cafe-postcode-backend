# Host-level TLS/edge Nginx config for Cafe Postcode.
# Docker services listen on local ports:
#   backend:    127.0.0.1:8880
#   control:    127.0.0.1:4500
#   grafana:    127.0.0.1:3001
#   prometheus: 127.0.0.1:9090
#   portainer:  127.0.0.1:9444

# Cloudflare's published edge networks. Keep this list synchronized with
# https://www.cloudflare.com/ips/ before every infrastructure rollout.
# Use the original TCP peer. The realip module later rewrites $remote_addr to
# CF-Connecting-IP, which must not be used to decide whether the peer is a
# Cloudflare edge.
geo $realip_remote_addr $postcode_cloudflare_edge {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$postcode_cloudflare_edge:$uri" $postcode_origin_allowed {
    default 0;
    ~^1: 1;
    ~^0:/\.well-known/acme-challenge/ 1;
}

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 80;
    listen [::]:80;
    server_name cafe-postcode.uz pos.cafe-postcode.uz admin.cafe-postcode.uz control.cafe-postcode.uz dashboard.cafe-postcode.uz grafana.cafe-postcode.uz prometheus.cafe-postcode.uz portainer.cafe-postcode.uz;

    if ($postcode_origin_allowed = 0) { return 444; }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cafe-postcode.uz;

    if ($postcode_origin_allowed = 0) { return 444; }

    ssl_certificate /etc/letsencrypt/live/cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    client_max_body_size 20m;

    location = /grafana {
        return 301 https://grafana.cafe-postcode.uz/;
    }

    location /grafana/ {
        return 301 https://grafana.cafe-postcode.uz/;
    }

    location = /prometheus {
        return 301 https://prometheus.cafe-postcode.uz/;
    }

    location /prometheus/ {
        return 301 https://prometheus.cafe-postcode.uz/;
    }

    location = /portainer {
        return 404;
    }

    location /portainer/ {
        return 404;
    }

    location /ws/ {
        include proxy_params;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8880;
    }

    # Public application API; Django's built-in administration is disabled.
    location /api/ {
        include proxy_params;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8880;
    }

    location /admin/ {
        return 404;
    }

    location /healthz/ {
        include proxy_params;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://127.0.0.1:8880;
    }

    location /static/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8880;
    }

    location /media/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8880;
    }

    location / {
        root /var/www/cafe-postcode-landing;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.cafe-postcode.uz;

    if ($postcode_origin_allowed = 0) { return 444; }

    ssl_certificate /etc/letsencrypt/live/grafana.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    location / {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3001;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prometheus.cafe-postcode.uz;

    if ($postcode_origin_allowed = 0) { return 444; }

    ssl_certificate /etc/letsencrypt/live/grafana.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    auth_basic "Prometheus";
    auth_basic_user_file /etc/nginx/.htpasswd-prometheus;

    location / {
        limit_req zone=monitoring_auth burst=10 nodelay;
        include proxy_params;
        proxy_pass http://127.0.0.1:9090;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portainer.cafe-postcode.uz;

    if ($postcode_origin_allowed = 0) { return 444; }

    ssl_certificate /etc/letsencrypt/live/portainer.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portainer.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    # Portainer has root-equivalent Docker socket access. Keep the container
    # bound to localhost and reach it only through an SSH tunnel.
    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.cafe-postcode.uz;

    if ($postcode_origin_allowed = 0) { return 444; }

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: http: ws:; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    ssl_certificate /etc/letsencrypt/live/pos.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    location / {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4300;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.cafe-postcode.uz;

    if ($postcode_origin_allowed = 0) { return 444; }

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    ssl_certificate /etc/letsencrypt/live/admin.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    location = /control {
        return 302 /control/;
    }

    location ^~ /control/ {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4500;
    }

    location / {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4200;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name control.cafe-postcode.uz;

    if ($postcode_origin_allowed = 0) { return 444; }

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    ssl_certificate /etc/letsencrypt/live/control.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/control.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = / {
        return 302 /control/;
    }

    location = /control {
        return 302 /control/;
    }

    location ^~ /control/ {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4500;
    }

    location / {
        return 404;
    }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.cafe-postcode.uz;

    if ($postcode_origin_allowed = 0) { return 444; }

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    ssl_certificate /etc/letsencrypt/live/dashboard.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    location / {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4400;
    }
}
