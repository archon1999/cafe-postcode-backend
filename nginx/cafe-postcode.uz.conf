}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dashboard.cafe-postcode.uz;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
