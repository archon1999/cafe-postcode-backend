# Host-level TLS/edge Nginx config for Cafe Postcode.
# Docker services listen on local ports:
#   backend:    127.0.0.1:8880
#   grafana:    127.0.0.1:3001
#   prometheus: 127.0.0.1:9090
#   portainer:  127.0.0.1:9444

server {
    listen 80;
    listen [::]:80;
    server_name cafe-postcode.uz pos.cafe-postcode.uz admin.cafe-postcode.uz dashboard.cafe-postcode.uz grafana.cafe-postcode.uz prometheus.cafe-postcode.uz portainer.cafe-postcode.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name cafe-postcode.uz;

    ssl_certificate /etc/letsencrypt/live/cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    client_max_body_size 20m;

    location = /grafana {
        return 301 https://grafana.cafe-postcode.uz/;
    }

    location /grafana/ {
        return 301 https://grafana.cafe-postcode.uz/;
    }

    location = /prometheus {
        return 301 https://prometheus.cafe-postcode.uz/;
    }

    location /prometheus/ {
        return 301 https://prometheus.cafe-postcode.uz/;
    }

    location = /portainer {
        return 301 https://portainer.cafe-postcode.uz/;
    }

    location /portainer/ {
        return 301 https://portainer.cafe-postcode.uz/;
    }

    location /ws/ {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:8880;
    }

    # Keep the existing POS API and Django administration routes available.
    location /api/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8880;
    }

    location /admin/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8880;
    }

    location /healthz/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8880;
    }

    location /static/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8880;
    }

    location /media/ {
        include proxy_params;
        proxy_pass http://127.0.0.1:8880;
    }

    location / {
        root /var/www/cafe-postcode-landing;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name grafana.cafe-postcode.uz;

    ssl_certificate /etc/letsencrypt/live/grafana.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    location / {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:3001;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name prometheus.cafe-postcode.uz;

    ssl_certificate /etc/letsencrypt/live/grafana.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    auth_basic "Prometheus";
    auth_basic_user_file /etc/nginx/.htpasswd-prometheus;

    location / {
        limit_req zone=monitoring_auth burst=10 nodelay;
        include proxy_params;
        proxy_pass http://127.0.0.1:9090;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name portainer.cafe-postcode.uz;

    ssl_certificate /etc/letsencrypt/live/portainer.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portainer.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    auth_basic "Postcode Portainer";
    auth_basic_user_file /etc/nginx/.htpasswd-postcode-portainer;
    client_max_body_size 100m;
    location / {
        limit_req zone=monitoring_auth burst=20 nodelay;
        include proxy_params;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass https://127.0.0.1:9444;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pos.cafe-postcode.uz;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss: http: ws:; worker-src 'self' blob:" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    ssl_certificate /etc/letsencrypt/live/pos.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    if ($block_scanner_ua) { return 444; }

    location / {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4300;
    }
}
