services:
  web:
    image: ${BACKEND_IMAGE:-postcode/backend:local}
    build:
      context: .
    environment:
      DJANGO_PRODUCTION: "1"
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,cafe-postcode.uz,www.cafe-postcode.uz}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,https://cafe-postcode.uz,https://www.cafe-postcode.uz,https://control.cafe-postcode.uz}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,https://cafe-postcode.uz,https://www.cafe-postcode.uz,https://control.cafe-postcode.uz}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-0}
      ENABLE_BROWSABLE_API: "0"
      DISABLE_CSRF_CHECKS: "0"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-1}
      DB_ENGINE: postgres
      DB_NAME: ${POSTGRES_DB:-cafe_postcode}
      DB_USER: ${DB_APP_USER:?Set DB_APP_USER in .env.production}
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env.production}
      DB_ADMIN_USER: ${POSTGRES_USER:-cafe_postcode}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_MFA_FERNET_KEYS: ${ADMIN_MFA_FERNET_KEYS:?Set ADMIN_MFA_FERNET_KEYS in .env.production}
      ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-0}
      ADMIN_AUTH_ALLOWED_ORIGINS: ${ADMIN_AUTH_ALLOWED_ORIGINS:-https://admin.cafe-postcode.uz,https://control.cafe-postcode.uz}
      INTEGRATION_FERNET_KEYS: ${INTEGRATION_FERNET_KEYS:?Set INTEGRATION_FERNET_KEYS in .env.production}
      DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-0}
      DJANGO_ADMIN_ALLOWED_CIDRS: ${DJANGO_ADMIN_ALLOWED_CIDRS:-}
      DJANGO_ADMIN_TRUSTED_PROXY_CIDRS: ${DJANGO_ADMIN_TRUSTED_PROXY_CIDRS:-}
      CLIENT_IP_TRUSTED_PROXY_CIDRS: ${CLIENT_IP_TRUSTED_PROXY_CIDRS:?Set CLIENT_IP_TRUSTED_PROXY_CIDRS in .env.production}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_LEADS_CHAT_ID: ${TELEGRAM_LEADS_CHAT_ID:-}
      TELEGRAM_TIMEOUT: ${TELEGRAM_TIMEOUT:-10}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      YANDEX_TRANSLATE_API_KEY: ${YANDEX_TRANSLATE_API_KEY:-}
      YANDEX_TRANSLATE_FOLDER_ID: ${YANDEX_TRANSLATE_FOLDER_ID:-}
      YANDEX_TRANSLATE_TIMEOUT: ${YANDEX_TRANSLATE_TIMEOUT:-10}
      FAKTURA_TOKEN_URL: ${FAKTURA_TOKEN_URL:-https://account.faktura.uz/token}
      FAKTURA_API_BASE_URL: ${FAKTURA_API_BASE_URL:-https://api.faktura.uz}
      FAKTURA_USERNAME: ${FAKTURA_USERNAME:-}
      FAKTURA_PASSWORD: ${FAKTURA_PASSWORD:-}
      FAKTURA_CLIENT_ID: ${FAKTURA_CLIENT_ID:-}
      FAKTURA_CLIENT_SECRET: ${FAKTURA_CLIENT_SECRET:-}
      FAKTURA_TIMEOUT: ${FAKTURA_TIMEOUT:-10}
      FAKTURA_PROXY_URL: ${FAKTURA_PROXY_URL:-}
      TELEGRAM_REPORTS_BOT_TOKEN: ${TELEGRAM_REPORTS_BOT_TOKEN:-}
      TELEGRAM_REPORTS_BOT_USERNAME: ${TELEGRAM_REPORTS_BOT_USERNAME:-}
      TELEGRAM_REPORTS_WEBHOOK_SECRET: ${TELEGRAM_REPORTS_WEBHOOK_SECRET:-}
      TELEGRAM_REPORTS_WEBHOOK_URL: ${TELEGRAM_REPORTS_WEBHOOK_URL:-https://cafe-postcode.uz/api/v1/telegram-reports/webhook/}
      ADMIN_AUTH_SESSION_TTL_SECONDS: ${ADMIN_AUTH_SESSION_TTL_SECONDS:-900}
      POS_AUTH_SESSION_TTL_SECONDS: ${POS_AUTH_SESSION_TTL_SECONDS:-86400}
      DASHBOARD_AUTH_SESSION_TTL_SECONDS: ${DASHBOARD_AUTH_SESSION_TTL_SECONDS:-86400}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-cpython}
      AWS_S3_MEDIA_PREFIX: ${AWS_S3_MEDIA_PREFIX:-media/cafe-postcode}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
      LOCAL_AGENT_RELEASE_MANIFEST_URL: ${LOCAL_AGENT_RELEASE_MANIFEST_URL:-https://admin.cafe-postcode.uz/downloads/local-agent-release.json}
      DEVICE_PAIRING_CLAIM_BASE_URL: ${DEVICE_PAIRING_CLAIM_BASE_URL:-https://control.cafe-postcode.uz/pair}
      DEVICE_POS_PROOF_REQUIRED: ${DEVICE_POS_PROOF_REQUIRED:-1}
      DEVICE_LEGACY_POS_MIGRATION_ENABLED: ${DEVICE_LEGACY_POS_MIGRATION_ENABLED:-0}
      DEVICE_LEGACY_POS_SESSION_AUTH_ENABLED: ${DEVICE_LEGACY_POS_SESSION_AUTH_ENABLED:-0}
      DEVICE_LEGACY_LOCAL_AGENT_MIGRATION_ENABLED: ${DEVICE_LEGACY_LOCAL_AGENT_MIGRATION_ENABLED:-0}
      DEVICE_LEGACY_LOCAL_AGENT_AUTH_ENABLED: ${DEVICE_LEGACY_LOCAL_AGENT_AUTH_ENABLED:-0}
      DEVICE_LEGACY_LOCAL_AGENT_RECOVERY_BINDINGS: ${DEVICE_LEGACY_LOCAL_AGENT_RECOVERY_BINDINGS:-}
      DEVICE_LEGACY_TV_PAIRING_ENABLED: ${DEVICE_LEGACY_TV_PAIRING_ENABLED:-0}
      DEVICE_LEGACY_TV_MIGRATION_ENABLED: ${DEVICE_LEGACY_TV_MIGRATION_ENABLED:-0}
      DEVICE_LEGACY_MIGRATION_STARTED_AT: ${DEVICE_LEGACY_MIGRATION_STARTED_AT:-}
      DEVICE_LEGACY_MIGRATION_DEADLINE: ${DEVICE_LEGACY_MIGRATION_DEADLINE:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-60}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
    command:
      - sh
      - -c
      - >-
        python manage.py check_database_role &&
        rm -rf /tmp/prometheus-multiproc &&
        mkdir -p /tmp/prometheus-multiproc &&
        exec gunicorn core.wsgi:application
        --bind 0.0.0.0:8000
        --no-control-socket
        --workers $${GUNICORN_WORKERS:-3}
        --threads $${GUNICORN_THREADS:-2}
        --timeout $${GUNICORN_TIMEOUT:-60}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8000/readyz/', headers={'Host':'cafe-postcode.uz'}); urllib.request.urlopen(request, timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  migrate:
    extends:
      service: web
    profiles: ["operations"]
    environment:
      DB_USER: ${POSTGRES_USER:-cafe_postcode}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      DB_ADMIN_USER: ${POSTGRES_USER:-cafe_postcode}
      DJANGO_MIGRATION_PROCESS: "1"
      PGOPTIONS: -c lock_timeout=${MIGRATION_LOCK_TIMEOUT:-5s} -c statement_timeout=${MIGRATION_STATEMENT_TIMEOUT:-15min}
    command:
      - sh
      - -c
      - >-
        python manage.py migrate --noinput &&
        python manage.py collectstatic --noinput
    restart: "no"
    healthcheck:
      disable: true

  ws:
    image: ${BACKEND_IMAGE:-postcode/backend:local}
    build:
      context: .
    environment:
      DJANGO_PRODUCTION: "1"
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,cafe-postcode.uz,www.cafe-postcode.uz}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,https://cafe-postcode.uz,https://www.cafe-postcode.uz,https://control.cafe-postcode.uz}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,https://cafe-postcode.uz,https://www.cafe-postcode.uz,https://control.cafe-postcode.uz}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-0}
      ENABLE_BROWSABLE_API: "0"
      DISABLE_CSRF_CHECKS: "0"
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
      CSRF_COOKIE_SECURE: ${CSRF_COOKIE_SECURE:-1}
      DB_ENGINE: postgres
      DB_NAME: ${POSTGRES_DB:-cafe_postcode}
      DB_USER: ${DB_APP_USER:?Set DB_APP_USER in .env.production}
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env.production}
      DB_ADMIN_USER: ${POSTGRES_USER:-cafe_postcode}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_MFA_FERNET_KEYS: ${ADMIN_MFA_FERNET_KEYS:?Set ADMIN_MFA_FERNET_KEYS in .env.production}
      ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-0}
      ADMIN_AUTH_ALLOWED_ORIGINS: ${ADMIN_AUTH_ALLOWED_ORIGINS:-https://admin.cafe-postcode.uz,https://control.cafe-postcode.uz}
      INTEGRATION_FERNET_KEYS: ${INTEGRATION_FERNET_KEYS:?Set INTEGRATION_FERNET_KEYS in .env.production}
      DJANGO_ADMIN_ENABLED: ${DJANGO_ADMIN_ENABLED:-0}
      DJANGO_ADMIN_ALLOWED_CIDRS: ${DJANGO_ADMIN_ALLOWED_CIDRS:-}
      DJANGO_ADMIN_TRUSTED_PROXY_CIDRS: ${DJANGO_ADMIN_TRUSTED_PROXY_CIDRS:-}
      CLIENT_IP_TRUSTED_PROXY_CIDRS: ${CLIENT_IP_TRUSTED_PROXY_CIDRS:?Set CLIENT_IP_TRUSTED_PROXY_CIDRS in .env.production}
      ADMIN_AUTH_SESSION_TTL_SECONDS: ${ADMIN_AUTH_SESSION_TTL_SECONDS:-900}
      POS_AUTH_SESSION_TTL_SECONDS: ${POS_AUTH_SESSION_TTL_SECONDS:-86400}
      DASHBOARD_AUTH_SESSION_TTL_SECONDS: ${DASHBOARD_AUTH_SESSION_TTL_SECONDS:-86400}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-cpython}
      AWS_S3_MEDIA_PREFIX: ${AWS_S3_MEDIA_PREFIX:-media/cafe-postcode}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
      DEVICE_LEGACY_LOCAL_AGENT_AUTH_ENABLED: ${DEVICE_LEGACY_LOCAL_AGENT_AUTH_ENABLED:-0}
      DEVICE_LEGACY_LOCAL_AGENT_RECOVERY_BINDINGS: ${DEVICE_LEGACY_LOCAL_AGENT_RECOVERY_BINDINGS:-}
      DEVICE_LEGACY_MIGRATION_STARTED_AT: ${DEVICE_LEGACY_MIGRATION_STARTED_AT:-}
      DEVICE_LEGACY_MIGRATION_DEADLINE: ${DEVICE_LEGACY_MIGRATION_DEADLINE:-}
    command:
      - sh
      - -c
      - >-
        python manage.py check_database_role &&
        exec daphne -b 0.0.0.0 -p 8888 core.asgi:application
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request=urllib.request.Request('http://127.0.0.1:8888/readyz/', headers={'Host':'cafe-postcode.uz'}); urllib.request.urlopen(request, timeout=4).read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  qcluster:
    image: ${BACKEND_IMAGE:-postcode/backend:local}
    build:
      context: .
    environment:
      DJANGO_PRODUCTION: "1"
      DEBUG: "0"
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env.production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,cafe-postcode.uz,www.cafe-postcode.uz}
      DB_ENGINE: postgres
      DB_NAME: ${POSTGRES_DB:-cafe_postcode}
      DB_USER: ${DB_APP_USER:?Set DB_APP_USER in .env.production}
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env.production}
      DB_ADMIN_USER: ${POSTGRES_USER:-cafe_postcode}
      DB_HOST: postgres
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      LOG_FORMAT: json
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ADMIN_MFA_FERNET_KEYS: ${ADMIN_MFA_FERNET_KEYS:?Set ADMIN_MFA_FERNET_KEYS in .env.production}
      INTEGRATION_FERNET_KEYS: ${INTEGRATION_FERNET_KEYS:?Set INTEGRATION_FERNET_KEYS in .env.production}
      DJANGO_ADMIN_ENABLED: "0"
      CLIENT_IP_TRUSTED_PROXY_CIDRS: ${CLIENT_IP_TRUSTED_PROXY_CIDRS:?Set CLIENT_IP_TRUSTED_PROXY_CIDRS in .env.production}
      TELEGRAM_REPORTS_BOT_TOKEN: ${TELEGRAM_REPORTS_BOT_TOKEN:-}
      TELEGRAM_REPORTS_BOT_USERNAME: ${TELEGRAM_REPORTS_BOT_USERNAME:-}
      TELEGRAM_REPORTS_WEBHOOK_SECRET: ${TELEGRAM_REPORTS_WEBHOOK_SECRET:-}
      TELEGRAM_TIMEOUT: ${TELEGRAM_TIMEOUT:-10}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-cpython}
      AWS_S3_MEDIA_PREFIX: ${AWS_S3_MEDIA_PREFIX:-media/cafe-postcode}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
      Q_CLUSTER_WORKERS: ${Q_CLUSTER_WORKERS:-1}
    command: ["sh", "-c", "python manage.py check_database_role && exec python manage.py qcluster"]
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      web:
        condition: service_healthy
      ws:
        condition: service_healthy
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8880}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media:/app/media:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - --header='Host: cafe-postcode.uz' http://127.0.0.1/readyz/ >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cafe_postcode}
      POSTGRES_USER: ${POSTGRES_USER:-cafe_postcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-role-provisioner:
    image: postgres:16-alpine
    profiles: ["operations"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-cafe_postcode}
      PGUSER: ${POSTGRES_USER:-cafe_postcode}
      DB_APP_USER: ${DB_APP_USER:?Set DB_APP_USER in .env.production}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env.production}
      DB_MONITOR_USER: ${DB_MONITOR_USER:?Set DB_MONITOR_USER in .env.production}
      DB_MONITOR_PASSWORD: ${DB_MONITOR_PASSWORD:?Set DB_MONITOR_PASSWORD in .env.production}
    command:
      - sh
      - -ceu
      - >-
        for role_name in "$${PGUSER}" "$${DB_APP_USER}" "$${DB_MONITOR_USER}"; do
          case "$${role_name}" in
            ""|*[!A-Za-z0-9_]*|[0-9]*) echo "Invalid database role name." >&2; exit 1 ;;
          esac;
        done;
        test "$${PGUSER}" != "$${DB_APP_USER}";
        test "$${PGUSER}" != "$${DB_MONITOR_USER}";
        test "$${DB_APP_USER}" != "$${DB_MONITOR_USER}";
        case "$${DB_MONITOR_PASSWORD}" in
          ""|*[!A-Za-z0-9._~-]*) echo "DB_MONITOR_PASSWORD must be URL-safe." >&2; exit 1 ;;
        esac;
        exec psql --no-psqlrc --set=ON_ERROR_STOP=1
        --set=owner_user="$${PGUSER}"
        --set=database_name="$${PGDATABASE}"
        --set=app_user="$${DB_APP_USER}"
        --set=app_password="$${DB_APP_PASSWORD}"
        --set=monitor_user="$${DB_MONITOR_USER}"
        --set=monitor_password="$${DB_MONITOR_PASSWORD}"
        --file=/opt/postcode/provision-database-roles.sql
    volumes:
      - ./ops/provision-database-roles.sql:/opt/postcode/provision-database-roles.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.external-url=https://prometheus.cafe-postcode.uz/"
      - "--web.route-prefix=/"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    depends_on:
      web:
        condition: service_healthy
      postgres-exporter:
        condition: service_started
      redis-exporter:
        condition: service_started
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env.production}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-https://grafana.cafe-postcode.uz/}
      GF_SERVER_SERVE_FROM_SUB_PATH: ${GRAFANA_SERVE_FROM_SUB_PATH:-false}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: postgresql://${DB_MONITOR_USER:?Set DB_MONITOR_USER in .env.production}:${DB_MONITOR_PASSWORD:?Set a URL-safe DB_MONITOR_PASSWORD in .env.production}@postgres:5432/${POSTGRES_DB:-cafe_postcode}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["host-observability"]
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    profiles: ["host-observability"]
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:2.39.2
    profiles: ["docker-admin"]
    command:
      - "-H"
      - "unix:///var/run/docker.sock"
      - "--hide-label"
      - "com.docker.compose.project=kep"
    ports:
      - "127.0.0.1:${PORTAINER_PORT:-9444}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  staticfiles:
  media:
  prometheus_data:
  grafana_data:
  portainer_data:
