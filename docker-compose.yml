services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cafe-postcode-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.runtime/staticfiles:/app/staticfiles
      - ./.runtime/media:/app/media
      - ./.runtime/var:/app/var
