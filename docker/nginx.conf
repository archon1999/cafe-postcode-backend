map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~*https https;
    http http;
    https https;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Incident containment: this retired MARMARA Local Agent is still polling with
# a revoked credential. Keep the requests in the Nginx access log, but stop
# them before they can repeatedly enter the application authentication layer.
map $http_x_device_id $quarantined_device_credential {
    default 0;
    ~*^eb3c20ca-83f9-45c8-bba7-027bbc64dcb6$ 1;
}

server {
    listen 80;
    server_name _;

    if ($quarantined_device_credential) {
        return 403;
    }

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $postcode_backend http://web:8000;
    set $postcode_ws http://ws:8888;

    client_max_body_size 20m;

    location = /metrics {
        return 404;
    }

    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /ws/ {
        proxy_pass $postcode_ws;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass $postcode_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Request-ID $request_id;
    }
}
