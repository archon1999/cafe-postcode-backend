# Host-level TLS/edge Nginx config migrated from /home/cpython/server/nginx.conf.
# Docker services listen on local ports:
#   backend:   127.0.0.1:8880
#   admin SPA: 127.0.0.1:4200
#   POS SPA:   127.0.0.1:4300
#   dashboard: 127.0.0.1:4400

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    server_name pos.cafe-postcode.uz;

    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/pos.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pos.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name admin.cafe-postcode.uz;

    location / {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/admin.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name dashboard.cafe-postcode.uz;

    location / {
        proxy_pass http://127.0.0.1:4400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/dashboard.cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name cafe-postcode.uz www.cafe-postcode.uz;
    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://127.0.0.1:8880;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 75s;
    }

    location /healthz/ {
        proxy_pass http://127.0.0.1:8880;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /readyz/ {
        proxy_pass http://127.0.0.1:8880;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cafe-postcode.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cafe-postcode.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name cafe-postcode.uz www.cafe-postcode.uz pos.cafe-postcode.uz admin.cafe-postcode.uz dashboard.cafe-postcode.uz;
    return 301 https://$host$request_uri;
}
