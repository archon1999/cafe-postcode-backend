name: MCP release
on:
  push:
    branches: [mcp-production]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: mcp-release
  cancel-in-progress: false
jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mcp_ci
          POSTGRES_USER: mcp_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgres
      DB_NAME: mcp_ci
      DB_USER: mcp_ci
      DB_PASSWORD: ci-only-password
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_CONN_MAX_AGE: '0'
      DEBUG: '0'
      ALLOWED_HOSTS: localhost,testserver,127.0.0.1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          pip install poetry==2.3.3
          poetry install --no-interaction --no-root
      - name: Check and test on PostgreSQL
        run: |
          poetry run ruff check apps/analytics_mcp core/mcp_asgi.py core/settings/mcp.py --extend-select F401
          poetry run python manage.py makemigrations --check --dry-run
          poetry run python manage.py test apps.analytics_mcp.tests apps.dashboard.tests apps.reporting.tests --noinput
      - name: Build immutable image
        run: docker build -f Dockerfile.mcp --label org.opencontainers.image.revision="$GITHUB_SHA" -t postcode/mcp:$GITHUB_SHA .
      - name: Verify final runtime against PostgreSQL
        run: |
          docker run --rm --network host -e DB_ENGINE -e DB_NAME -e DB_USER -e DB_PASSWORD -e DB_HOST -e DB_PORT -e DB_CONN_MAX_AGE -e DEBUG -e ALLOWED_HOSTS postcode/mcp:$GITHUB_SHA python manage.py test apps.analytics_mcp.tests --noinput
      - name: Scan image
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: postcode/mcp:${{ github.sha }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.1.3
      - name: Export and sign release artifact
        run: |
          mkdir release
          docker save postcode/mcp:$GITHUB_SHA | gzip -1 > release/mcp-image.tar.gz
          docker image inspect postcode/mcp:$GITHUB_SHA --format '{{.Id}}' > release/image-id.txt
          printf '%s\n' "$GITHUB_SHA" > release/revision.txt
          cd release
          sha256sum mcp-image.tar.gz image-id.txt revision.txt > SHA256SUMS
          cosign sign-blob --yes --bundle release.sigstore.json SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mcp-release-${{ github.sha }}
          path: release/
          retention-days: 14
          compression-level: 0

