name: Deploy Backend

on:
  push:
    branches:
      - production
    paths-ignore:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - inspect_agent_status

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Deploy production over SSH
        env:
          FAKTURA_USERNAME_B64: ${{ secrets.FAKTURA_USERNAME_B64 }}
          FAKTURA_PASSWORD_B64: ${{ secrets.FAKTURA_PASSWORD_B64 }}
          FAKTURA_CLIENT_ID_B64: ${{ secrets.FAKTURA_CLIENT_ID_B64 }}
          FAKTURA_CLIENT_SECRET_B64: ${{ secrets.FAKTURA_CLIENT_SECRET_B64 }}
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          fingerprint: ${{ secrets.HOST_FINGERPRINT }}
          port: ${{ secrets.PORT }}
          timeout: 60s
          command_timeout: 40m
          envs: FAKTURA_USERNAME_B64,FAKTURA_PASSWORD_B64,FAKTURA_CLIENT_ID_B64,FAKTURA_CLIENT_SECRET_B64
          script_stop: true
          script: |
            set -Eeuo pipefail
            exec 9>/home/postcode/.cafe-postcode-deploy.lock
            flock --wait 1800 9
            cd /home/postcode/backend
            test -f .env.production
            python3 - <<'PY'
            import base64
            import os
            from pathlib import Path

            keys = (
                'FAKTURA_USERNAME',
                'FAKTURA_PASSWORD',
                'FAKTURA_CLIENT_ID',
                'FAKTURA_CLIENT_SECRET',
            )
            values = {}
            for key in keys:
                encoded = os.environ.get(f'{key}_B64', '')
                if not encoded:
                    raise SystemExit(f'Missing GitHub Actions secret: {key}_B64')
                value = base64.b64decode(encoded, validate=True).decode('utf-8')
                if not value:
                    raise SystemExit(f'Empty Faktura credential: {key}')
                values[key] = value

            env_path = Path('.env.production')
            original_lines = env_path.read_text(encoding='utf-8').splitlines()
            remaining = dict(values)
            updated_lines = []

            def encode_env_value(value):
                return "'" + value.replace('\\', '\\\\').replace("'", "\\'") + "'"

            for line in original_lines:
                key, separator, _ = line.partition('=')
                if separator and key in remaining:
                    updated_lines.append(f'{key}={encode_env_value(remaining.pop(key))}')
                else:
                    updated_lines.append(line)
            if remaining:
                updated_lines.append('')
                updated_lines.extend(
                    f'{key}={encode_env_value(value)}'
                    for key, value in remaining.items()
                )
            env_path.write_text('\n'.join(updated_lines) + '\n', encoding='utf-8')
            env_path.chmod(0o600)
            print('Faktura production credentials synchronized.')
            PY
            operation='${{ inputs.operation }}'
            if [ "$operation" = 'inspect_agent_status' ]; then
              docker compose --env-file .env.production exec -T web python manage.py shell <<'PY'
            import json
            from apps.devices.models import Device, DevicePairing, SecurityEvent
            from apps.restaurants.models import Restaurant
            from django.utils import timezone

            print(json.dumps({'serverNow': timezone.now()}, default=str))
            for restaurant_name in ('SHARIPOV GAFFUR AXMEDOVICH', "OLTIN JO'JA"):
                restaurant = Restaurant.objects.filter(name__iexact=restaurant_name).first()
                print(json.dumps({'restaurant': restaurant_name, 'found': bool(restaurant), 'id': str(restaurant.pk) if restaurant else None}))
                if not restaurant:
                    continue
                devices = Device.objects.filter(restaurant=restaurant, type=Device.Type.LOCAL_AGENT).order_by('-paired_at')
                for device in devices:
                    print(json.dumps({
                        'kind': 'device',
                        'restaurant': restaurant.name,
                        'id': str(device.pk),
                        'name': device.name,
                        'version': device.app_version,
                        'status': device.status,
                        'pairedAt': device.paired_at,
                        'lastSeenAt': device.last_seen_at,
                        'leaseExpiresAt': device.lease_expires_at,
                        'revokedAt': device.revoked_at,
                        'revokeReason': device.revoke_reason,
                        'fingerprint': f'{device.public_key_fingerprint[:6]}...{device.public_key_fingerprint[-6:]}',
                    }, default=str))
                    pairings = DevicePairing.objects.filter(public_key_fingerprint=device.public_key_fingerprint).order_by('-created_at')[:3]
                    for pairing in pairings:
                        print(json.dumps({
                            'kind': 'pairing',
                            'restaurant': restaurant.name,
                            'deviceId': str(device.pk),
                            'id': str(pairing.pk),
                            'status': pairing.status,
                            'createdAt': pairing.created_at,
                            'expiresAt': pairing.expires_at,
                            'approvedAt': pairing.approved_at,
                        }, default=str))
                events = SecurityEvent.objects.filter(restaurant=restaurant).order_by('-created_at')[:15]
                for event in events:
                    print(json.dumps({
                        'kind': 'securityEvent',
                        'restaurant': restaurant.name,
                        'createdAt': event.created_at,
                        'eventType': event.event_type,
                        'result': event.result,
                        'deviceId': str(event.device_id) if event.device_id else None,
                        'metadata': event.metadata,
                    }, default=str))
            PY
              docker compose --env-file .env.production ps
              docker compose --env-file .env.production logs --since 30m --no-color web ws qcluster | grep -Ei '9D7IH87|OB1DGDK|b94edc|685da1|local.agent|heartbeat' | tail -n 200 || true
              exit 0
            fi
            migration_deadline='2026-09-19T19:30:00Z'
            if grep -q '^DEVICE_LEGACY_MIGRATION_DEADLINE=' .env.production; then
              sed -i "s|^DEVICE_LEGACY_MIGRATION_DEADLINE=.*$|DEVICE_LEGACY_MIGRATION_DEADLINE=${migration_deadline}|" .env.production
            else
              printf '\nDEVICE_LEGACY_MIGRATION_DEADLINE=%s\n' "$migration_deadline" >> .env.production
            fi
            if ! git diff --quiet || ! git diff --cached --quiet; then
              git stash push --message "pre-deploy-$(date -u +%Y%m%dT%H%M%SZ)"
            fi
            git fetch --prune origin production
            git checkout --detach origin/production
            docker compose --env-file .env.production config >/dev/null
            docker compose --env-file .env.production build
            docker compose --env-file .env.production --profile operations run --rm migrate
            docker compose --env-file .env.production up -d --remove-orphans --wait --wait-timeout 180
            docker compose --env-file .env.production ps
            docker compose --env-file .env.production exec -T web python manage.py check --deploy
            docker compose --env-file .env.production exec -T web python manage.py shell <<'PY'
            from apps.platform.services import FakturaClient

            expected_inn = '311926992'
            payload = FakturaClient().lookup_company_basic_details(expected_inn)
            if str(payload.get('CompanyInn') or '').strip() != expected_inn:
                raise SystemExit('Faktura production lookup returned an unexpected company.')
            print('Faktura production lookup: OK')
            PY
