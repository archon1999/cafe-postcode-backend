[project]
name = "cafe-postcode-backend"
version = "0.1.0"
description = "Backend service for the cafe-postcode.uz restaurant POS platform."
authors = [{ name = "Nazarbek" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
django-class-settings = "^0.2.0"
daphne = "^4.2.2"
django = "5.2.17"
django-cors-headers = "^4.7.0"
django-filter = "^25.1"
django-modeltranslation = "^0.19.16"
django-nested-inline = "^0.4.6"
django-q2 = "1.10.0"
croniter = "^6.2.4"
setuptools = "83.0.0"
djangorestframework = "^3.16.0"
sqlparse = "0.6.0"
djangorestframework-camel-case = "^1.4.2"
emoji = "^2.14.1"
django-solo = "^2.1.0"
psycopg2-binary = "^2.9.9"
pillow = "^12.3.0"
qrcode = "^8.2"
django-storages = "^1.14.6"
boto3 = "^1.39.11"
pytelegrambotapi = "^4.14.0"
psutil = "^5.9.5"
drf-extra-fields = "^3.7.0"
whitenoise = "^6.5.0"
redis = "^6.4.0"
openpyxl = "^3.1.2"
gunicorn = "^26.0.0"
drf-yasg = "^1.21.10"
channels = "^4.0.0"
python-levenshtein = "^0.24.0"
numpy = "^1.26.4"
httpx = "^0.28.1"
cryptography = "50.0.0"
django-prometheus = "^2.4.1"
python-json-logger = "^4.1.0"
channels-redis = "^4.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
loadtest = [
    "locust (>=2.43.4,<3.0.0)"
]
dev = [
    "django-debug-toolbar (>=4.2.0,<5.0.0)",
    "django-extensions (>=4.1,<5.0)",
    "django-hint (>=0.3.2,<0.4.0)",
    "djangorestframework-stubs (>=3.16.8,<4.0.0)",
    "polib (==1.2.0)",
    "ruff (==0.15.21)"
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
